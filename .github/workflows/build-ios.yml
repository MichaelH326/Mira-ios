name: Build iOS app (unsigned IPA)

# Produces an unsigned Mira.ipa on a macOS runner. Unsigned means it won't
# install on a stock iPhone directly — sideload it with a signing tool
# (AltStore, Sideloadly, or `xcrun devicectl` with your own certificate).

on:
  workflow_dispatch:
    inputs:
      model_source:
        description: "Where to get mira.mdlo"
        type: choice
        default: "latest-release"
        options:
          - "latest-release"   # newest Release asset named mira.mdlo
          - "none"             # build without a model; import one at runtime
      llama_ref:
        description: "llama.cpp git ref to build against (a tag pins the C API)"
        default: "master"
      publish_release:
        description: "Attach the IPA to the ios-latest prerelease"
        type: choice
        default: "true"
        options: ["true", "false"]
      bundle_tts:
        description: "Bundle the on-device voice and speech models (~145MB) — 'false' uses Apple's"
        type: choice
        default: "true"
        options: ["true", "false"]
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: write   # needed to attach the IPA to a release

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LLAMA_REF: ${{ github.event.inputs.llama_ref || 'master' }}
      MODEL_SOURCE: ${{ github.event.inputs.model_source || 'latest-release' }}
      PUBLISH_RELEASE: ${{ github.event.inputs.publish_release || 'true' }}
      BUNDLE_TTS: ${{ github.event.inputs.bundle_tts || 'true' }}
      SHERPA_REF: v1.13.6
      TTS_MODEL: vits-piper-en_US-libritts_r-medium
      TTS_ONNX: en_US-libritts_r-medium.onnx
      ASR_MODEL: sherpa-onnx-streaming-zipformer-en-2023-06-26
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      # llama.cpp dropped its Swift Package manifest, so we build the
      # official xcframework and link that instead. Only the two iOS slices
      # are requested: the script otherwise also builds macOS, visionOS and
      # tvOS, one platform at a time, which more than triples the runtime for
      # slices this app never loads.
      - name: Cache llama.xcframework
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/llama.xcframework
          key: llama-xcframework-${{ env.LLAMA_REF }}-${{ runner.os }}-v1

      - name: Build llama.xcframework
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/llama.cpp
          git clone https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cd /tmp/llama.cpp
          git checkout "$LLAMA_REF"
          ./build-xcframework.sh ios-device ios-sim
          rm -rf "$GITHUB_WORKSPACE/ios/Frameworks/llama.xcframework"
          mkdir -p "$GITHUB_WORKSPACE/ios/Frameworks"
          cp -R build-apple/llama.xcframework "$GITHUB_WORKSPACE/ios/Frameworks/"

      - name: Check the xcframework has an iOS device slice
        run: |
          set -euo pipefail
          test -d Frameworks/llama.xcframework || { echo "llama.xcframework is missing"; exit 1; }
          ls Frameworks/llama.xcframework
          test -d Frameworks/llama.xcframework/ios-arm64 \
            || { echo "no ios-arm64 slice in llama.xcframework"; exit 1; }

      # sherpa-onnx runs the on-device voice. build-ios.sh downloads a prebuilt
      # onnxruntime and compiles sherpa-onnx for device + both simulator
      # architectures, so the cold build is slow; the cache makes it once.
      - name: Cache sherpa-onnx.xcframework
        id: cache-sherpa
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/sherpa-onnx-build
          key: sherpa-onnx-${{ env.SHERPA_REF }}-${{ runner.os }}-v1

      - name: Build sherpa-onnx.xcframework
        if: steps.cache-sherpa.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew list wget >/dev/null 2>&1 || brew install wget
          rm -rf /tmp/sherpa-onnx
          git clone https://github.com/k2-fsa/sherpa-onnx /tmp/sherpa-onnx
          cd /tmp/sherpa-onnx
          git checkout "$SHERPA_REF"
          ./build-ios.sh
          OUT="$GITHUB_WORKSPACE/ios/Frameworks/sherpa-onnx-build"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp -R build-ios/sherpa-onnx.xcframework "$OUT/"
          # build-ios.sh drops the onnxruntime xcframework beside its own,
          # under a version directory reached through a symlink.
          cp -RL build-ios/ios-onnxruntime/onnxruntime.xcframework "$OUT/"

      - name: Stage the frameworks
        run: |
          set -euo pipefail
          for f in sherpa-onnx onnxruntime; do
            rm -rf "Frameworks/$f.xcframework"
            cp -R "Frameworks/sherpa-onnx-build/$f.xcframework" Frameworks/
            test -d "Frameworks/$f.xcframework/ios-arm64" \
              || { echo "no ios-arm64 slice in $f.xcframework"; ls "Frameworks/$f.xcframework"; exit 1; }
          done

      - name: Fetch the on-device voice
        if: ${{ env.BUNDLE_TTS != 'false' }}
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o /tmp/tts.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${TTS_MODEL}.tar.bz2"
          rm -rf /tmp/tts && mkdir -p /tmp/tts
          tar xjf /tmp/tts.tar.bz2 -C /tmp/tts
          SRC="/tmp/tts/${TTS_MODEL}"
          DEST=Resources/voice
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp "$SRC/${TTS_ONNX}" "$DEST/model.onnx"
          cp "$SRC/tokens.txt" "$DEST/"
          cp "$SRC/MODEL_CARD" "$DEST/" 2>/dev/null || true

          # espeak-ng-data ships a pronunciation dictionary per language and
          # they are 17MB of its 19MB. Mira speaks English, and espeak only
          # ever opens the dictionary for the language it is asked for, so
          # every other <lang>_dict is dead weight in the bundle.
          cp -R "$SRC/espeak-ng-data" "$DEST/"
          find "$DEST/espeak-ng-data" -maxdepth 1 -name '*_dict' ! -name 'en_dict' -delete
          test -f "$DEST/espeak-ng-data/en_dict" || { echo "en_dict was deleted"; exit 1; }
          for f in phondata phonindex phontab intonations; do
            test -f "$DEST/espeak-ng-data/$f" || { echo "espeak core file $f missing"; exit 1; }
          done
          echo "voice: $(du -sh "$DEST" | cut -f1) (espeak $(du -sh "$DEST/espeak-ng-data" | cut -f1))"

      - name: Fetch the streaming speech model
        if: ${{ env.BUNDLE_TTS != 'false' }}
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o /tmp/asr.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${ASR_MODEL}.tar.bz2"
          rm -rf /tmp/asr && mkdir -p /tmp/asr
          tar xjf /tmp/asr.tar.bz2 -C /tmp/asr
          SRC="/tmp/asr/${ASR_MODEL}"
          DEST=Resources/speech
          rm -rf "$DEST" && mkdir -p "$DEST"
          # int8 only: the float encoder alone is 249MB against 67MB quantized,
          # and the test wavs and export scripts are not needed on a phone.
          cp "$SRC"/encoder-*.int8.onnx "$DEST/encoder.onnx"
          cp "$SRC"/decoder-*.int8.onnx "$DEST/decoder.onnx"
          cp "$SRC"/joiner-*.int8.onnx  "$DEST/joiner.onnx"
          cp "$SRC/tokens.txt" "$DEST/"
          du -sh "$DEST"

      - name: Fetch mira.mdlo
        if: ${{ env.MODEL_SOURCE != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p Resources
          # Newest release carrying a mira.mdlo asset
          TAG=$(gh release list --limit 30 --json tagName,assets \
                 --jq '[.[] | select(any(.assets[]?; .name == "mira.mdlo"))][0].tagName' || true)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::warning::No release contains mira.mdlo — building without a bundled model."
            exit 0
          fi
          echo "Using model from release $TAG"
          gh release download "$TAG" --pattern mira.mdlo --dir Resources --clobber
          ls -lh Resources/mira.mdlo

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "No .app was produced"; exit 1
          fi
          echo "Packaging $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # Unsigned: strip any leftover signature metadata
          rm -rf Payload/*.app/_CodeSignature
          zip -qry Mira-unsigned.ipa Payload
          ls -lh Mira-unsigned.ipa

      - name: Verify the bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/check
          unzip -o -q Mira-unsigned.ipa -d /tmp/check
          APP=$(find /tmp/check/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "Bundle contents:"; ls -la "$APP"
          test -f "$APP/Info.plist" || { echo "missing Info.plist"; exit 1; }
          test -f "$APP/Mira" || { echo "missing app binary"; exit 1; }
          test -d "$APP/Frameworks" || { echo "missing embedded frameworks"; exit 1; }
          ls "$APP/Frameworks"
          # The icon is compiled into Assets.car, so its absence is silent —
          # you find out when the home screen shows a blank tile.
          test -f "$APP/Assets.car" || { echo "app icon missing from bundle"; exit 1; }
          if [ "$BUNDLE_TTS" != "false" ]; then
            test -f "$APP/voice/model.onnx" || { echo "voice model missing from bundle"; exit 1; }
            test -d "$APP/voice/espeak-ng-data" || { echo "espeak-ng-data flattened or missing"; exit 1; }
            test -f "$APP/voice/espeak-ng-data/en_dict" || { echo "en_dict missing from bundle"; exit 1; }
            echo "voice bundled: $(du -sh "$APP/voice" | cut -f1)"
            test -f "$APP/speech/encoder.onnx" || { echo "speech model missing from bundle"; exit 1; }
            echo "Speech model bundled: $(du -sh "$APP/speech" | cut -f1)"
          fi
          if [ -f "$APP/mira.mdlo" ]; then
            echo "model bundled: $(du -h "$APP/mira.mdlo" | cut -f1)"
          else
            echo "::warning::No model in the bundle — import one in the app at runtime."
          fi

      # Artifacts are always served as a zip, whatever is inside them, so a
      # download gives you Mira-unsigned-ipa.zip rather than an .ipa a signing
      # tool will accept. Release assets are served raw, so publish there too —
      # this is the link to open on the phone.
      - name: Publish the IPA to the ios-latest prerelease
        if: ${{ env.PUBLISH_RELEASE != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=ios-latest
          NOTES="Unsigned build of Mira for iOS, from ${GITHUB_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC').

          Download **Mira-unsigned.ipa** below and sign it with Sideloadly,
          AltStore, or your own certificate — iOS will not install it as-is.

          Rolling tag: each successful build replaces this asset."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" \
              --title "Mira for iOS (unsigned)" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
          gh release upload "$TAG" Mira-unsigned.ipa --clobber
          echo "Release assets now:"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'

      # Kept as well: the artifact is what a PR or a failed-release run can
      # still hand you, and it does not need a tag.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mira-unsigned-ipa
          path: ios/Mira-unsigned.ipa
          retention-days: 30
